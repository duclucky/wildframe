<section class="remix-history" aria-labelledby="historyTitle">
 <div class="history-heading"><div><p class="eyebrow">Keep the paths you take</p><h3 id="historyTitle">Your remix history</h3></div><span class="badge" id="historyCount">0 saved</span></div>
 <p class="lab-note" id="historyEmpty">Save a named variation to start a history for this recipe. Your versions stay in this browser.</p>
 <div class="saved-variation" id="variationHistory" hidden><button id="restoreVariation">Restore latest variation →</button></div>
 <div id="versionList" class="version-list"></div>
 <div id="versionCompareTools" hidden>
  <div class="compare-controls"><label>Version A<select id="versionA"></select></label><label>Version B<select id="versionB"></select></label></div>
  <button id="compareVersions" class="button small">Compare these versions</button>
 </div>
 <section id="versionComparison" class="version-comparison" aria-label="Text comparison between saved variations" hidden></section>
 <p class="lab-note">Comparison shows changes to the words. It does not generate or predict a new image.</p>
 <button id="downloadHistory" class="text-button" hidden>Download this recipe’s history ↗</button>
</section>
